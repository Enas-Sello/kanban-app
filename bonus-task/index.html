
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bonus Task - jQuery Dynamic List</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #f8f9fa;
        padding: 40px;
      }
      .fade-warning {
        color: red;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2 class="mb-3">🧩 Bonus Task: jQuery Dynamic List</h2>

      <div class="input-group mb-3">
        <input
          type="text"
          id="item-input"
          class="form-control"
          placeholder="Enter a new item"
        />
        <button id="add-btn" class="btn btn-primary">Add</button>
      </div>

      <p class="fade-warning">⚠️ Please enter a value!</p>

      <ul id="item-list" class="list-group"></ul>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
